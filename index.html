<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLB Showdown Placemat</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="placemat">
    <button id="newGameButton">🎮 Start New Game</button>
    <div id="gameUrlSection" style="display: none;">
      <input type="text" id="gameUrlInput" readonly />
      <button id="copyUrlButton">Copy URL</button>
    </div>

    <div class="top-grid">
      <div class="blue-square" id="B1">1</div>
      <div class="blue-square" id="B2">2</div>
      <div class="blue-square" id="B3">3</div>
      <div class="blue-square" id="B4">4</div>
      <div class="blue-square" id="B5">5</div>
      <div class="blue-square" id="B6">6</div>
      <div class="blue-square" id="B7">7</div>
      <div class="blue-square" id="B8">8</div>
      <div class="blue-square" id="B9">9</div>
      <div class="blue-square" id="BP">P</div>
      <div class="blue-square" id="BB">B</div>
    </div>

    <div class="placemat">
      <div class="field-area">
        <div class="warning-track"></div>
    
        <div class="foul-line left"></div>
        <div class="foul-line right"></div>
    
        <div class="diamond"></div>
    
        <div class="base-path home-first"></div>
        <div class="base-path first-second"></div>
        <div class="base-path second-third"></div>
        <div class="base-path third-home"></div>
    
    
        <div class="base" id="home"></div>
        <div class="base" id="first"></div>
        <div class="base" id="second"></div>
        <div class="base" id="third"></div>
    
        <div class="mound"></div>
      </div>
    
      </div>

    <div class="dice-container" id="dice1-container">
      <div class="dice-label">Home</div>
      <button id="dice1">🎲 Roll</button>
      <div id="diceResult1">Roll result: --</div>
    </div>

    <div class="dice-container" id="dice2-container">
      <div class="dice-label">Away</div>
      <button id="dice2">🎲 Roll</button>
      <div id="diceResult2">Roll result: --</div>
    </div>

    <div class="bottom-grid">
      <div class="red-square" id="R1">1</div>
      <div class="red-square" id="R2">2</div>
      <div class="red-square" id="R3">3</div>
      <div class="red-square" id="R4">4</div>
      <div class="red-square" id="R5">5</div>
      <div class="red-square" id="R6">6</div>
      <div class="red-square" id="R7">7</div>
      <div class="red-square" id="R8">8</div>
      <div class="red-square" id="R9">9</div>
      <div class="red-square" id="RB">Bench</div>
      <div class="red-square" id="RP">Bullpen</div>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none" accept="image/*">

  <script src="script.js"></script>
</body>
</html>
