<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLB Showdown Placemat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="placemat">

    <div class="top-grid">
      <div class="blue-square" id="B1" onclick="uploadImage('B1')">1</div>
      <div class="blue-square" id="B2" onclick="uploadImage('B2')">2</div>
      <div class="blue-square" id="B3" onclick="uploadImage('B3')">3</div>
      <div class="blue-square" id="B4" onclick="uploadImage('B4')">4</div>
      <div class="blue-square" id="B5" onclick="uploadImage('B5')">5</div>
      <div class="blue-square" id="B6" onclick="uploadImage('B6')">6</div>
      <div class="blue-square" id="B7" onclick="uploadImage('B7')">7</div>
      <div class="blue-square" id="B8" onclick="uploadImage('B8')">8</div>
      <div class="blue-square" id="B9" onclick="uploadImage('B9')">9</div>
      <div class="blue-square" id="BP" onclick="uploadImage('BP')">P</div>
      <div class="blue-square" id="BB" onclick="uploadImage('BB')">B</div>
    </div>

    <div class="field-area">
        <div class="diamond"></div>
      
        <div class="base" id="home"></div>
        <div class="base" id="first"></div>
        <div class="base" id="second"></div>
        <div class="base" id="third"></div>
      
        <div class="mound"></div>
      </div>
      

    <div class="bottom-grid">
      <div class="red-square" id="R1" onclick="uploadImage('R1')">1</div>
      <div class="red-square" id="R2" onclick="uploadImage('R2')">2</div>
      <div class="red-square" id="R3" onclick="uploadImage('R3')">3</div>
      <div class="red-square" id="R4" onclick="uploadImage('R4')">4</div>
      <div class="red-square" id="R5" onclick="uploadImage('R5')">5</div>
      <div class="red-square" id="R6" onclick="uploadImage('R6')">6</div>
      <div class="red-square" id="R7" onclick="uploadImage('R7')">7</div>
      <div class="red-square" id="R8" onclick="uploadImage('R8')">8</div>
      <div class="red-square" id="R9" onclick="uploadImage('R9')">9</div>
      <div class="red-square" id="RB" onclick="uploadImage('RB')">Bench</div>
      <div class="red-square" id="RP" onclick="uploadImage('RP')">Bullpen</div>
    </div>

  </div>

  <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleImage(event)">
  <script src="script.js"></script>
</body>
</html>
